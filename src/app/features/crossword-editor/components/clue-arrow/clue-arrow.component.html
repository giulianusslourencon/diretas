<div class="clue-arrow" [class]="direction()">

    <path

      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"

    <path
      d="M8 2 L8 12 M5 9 L8 12 L11 9"
      stroke="currentColor"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M8 14 L8 4 M5 7 L8 4 L11 7"
      stroke="currentColor"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M14 8 L4 8 M7 5 L4 8 L7 11"
      stroke="currentColor"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

      d="M2 8 L8 8 L8 14 M5 11 L8 14 L11 11"
      stroke="currentColor"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M8 2 L8 8 L14 8 M11 5 L14 8 L11 11"
      stroke="currentColor"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"

      stroke="currentColor"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M8 2 L8 8 L2 8 M5 5 L2 8 L5 11"

    <path
      d="M14 8 L8 8 L8 2 M11 5 L8 2 L5 5"
      stroke="currentColor"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    } @case ('up-left') {
    <path
      d="M8 14 L8 8 L2 8 M5 11 L2 8 L5 5"
      stroke="currentColor"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    } }

</div>
