<div class="crossword-editor-container">
  @if (isLoading()) {
  <div class="loading">
    <p>Carregando...</p>
  </div>
  } @else if (crossword()) {
  <header class="editor-header">
    <div class="header-left">
      <button class="btn btn-secondary" (click)="goBack()">← Voltar</button>
      <h1>{{ crossword()!.title }}</h1>
    </div>
    <div class="header-right">
      <button class="btn btn-primary" (click)="saveChanges()">Salvar</button>
    </div>
  </header>

  <main class="editor-content">
    <div class="grid-container">
      <app-crossword-grid
        [crossword]="crossword()!"
        [selectedCell]="selectedCell()"
        [activeTriangle]="activeTriangle()"
        (cellClick)="onCellClick($event)"
        (cellRightClick)="onCellRightClick($event)"
        (cellFocus)="onCellFocus($event)"
        (triangleClick)="onTriangleClick($event)"
        (triangleKeydown)="onTriangleKeydown($event)"
        (triangleBlur)="onTriangleBlur()"
        (clueInputBlur)="onClueInputBlur()"
      />
    </div>

    <app-editor-panel
      [selectedCell]="selectedCell()"
      (clearCell)="clearSelectedCell()"
      (saveChanges)="saveChanges()"
      (exportToPdf)="onExportToPdf($event)"
    />
  </main>
  } @else {
  <div class="error">
    <p>Erro ao carregar a palavra cruzada.</p>
    <button class="btn btn-primary" (click)="goBack()">Voltar</button>
  </div>
  }
</div>
