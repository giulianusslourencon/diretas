<div class="crossword-editor-container">
  @if (isLoading()) {
  <div class="loading">
    <p>Carregando...</p>
  </div>
  } @else if (crossword()) {
  <header class="editor-header">
    <div class="header-left">
      <button class="btn btn-secondary" (click)="goBack()">← Voltar</button>
      <h1>{{ crossword()!.title }}</h1>
    </div>
    <div class="header-right">
      <div class="save-section">
        @if (saveStatus() === 'saving') {
        <span class="save-status saving">Salvando...</span>
        } @else if (saveStatus() === 'saved') {
        <span class="save-status saved">✓ Salvo</span>
        } @else if (saveStatus() === 'error') {
        <span class="save-status error">✗ Erro ao salvar</span>
        }
        <button
          class="btn btn-primary"
          (click)="saveChanges()"
          [disabled]="saveStatus() === 'saving'"
        >
          Salvar
        </button>
        <span class="keyboard-hint">Ctrl+S</span>
      </div>
    </div>
  </header>

  <main class="editor-content">
    <div class="grid-container">
      <app-crossword-grid
        [crossword]="crossword()!"
        [selectedCell]="selectedCell()"
        [editingCell]="editingCell()"
        [activeTriangle]="activeTriangle()"
        [highlightedCells]="highlightedCells()"
        (cellClick)="onCellClick($event)"
        (cellDoubleClick)="onCellDoubleClick($event)"
        (cellRightClick)="onCellRightClick($event)"
        (cellFocus)="onCellFocus($event)"
        (triangleClick)="onTriangleClick($event)"
        (triangleKeydown)="onTriangleKeydown($event)"
        (triangleBlur)="onTriangleBlur()"
        (clueInputBlur)="onClueInputBlur()"
        (clueInputChange)="onCellPropertyChange()"
        (answerLetterChange)="onAnswerLetterChange($event)"
      />
    </div>

    <app-editor-panel
      [selectedCell]="selectedCell()"
      (clearCell)="clearSelectedCell()"
      (saveChanges)="saveChanges()"
      (exportToPdf)="onExportToPdf($event)"
      (editorMouseDown)="onEditorPanelMouseDown()"
      (editorMouseUp)="onEditorPanelMouseUp()"
      (cellPropertyChange)="onCellPropertyChange()"
      (clueTextChange)="updateClueText($event)"
      (clueDirectionChange)="updateClueDirection($event)"
      (textSizeChange)="updateTextSize($event)"
      (boldTextChange)="updateBoldText($event)"
    />
  </main>
  } @else {
  <div class="error">
    <p>Erro ao carregar a palavra cruzada.</p>
    <button class="btn btn-primary" (click)="goBack()">Voltar</button>
  </div>
  }
</div>
